<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Open World City</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}


/* ================================
   LOADING
================================ */

#loading{
    position:fixed;
    inset:0;
    background:#101010;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:1000;
}

#loading h1{
    font-size:42px;
    margin-bottom:20px;
}

#loadingBar{
    width:300px;
    height:8px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

#loadingProgress{
    width:0%;
    height:100%;
    background:#28d34f;
    transition:.2s;
}


/* ================================
   START SCREEN
================================ */

#startScreen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.65);
    color:white;
    z-index:900;
}

#startScreen h1{
    font-size:60px;
    margin-bottom:10px;
}

#startScreen p{
    color:#ccc;
    margin-bottom:25px;
}

#startButton{
    border:none;
    background:#e53935;
    color:white;
    padding:16px 42px;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;
}

#startButton:hover{
    background:#ff4d4d;
}


/* ================================
   HUD
================================ */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    z-index:100;
}

#money{
    position:absolute;
    top:25px;
    right:30px;
    font-size:25px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

#wanted{
    position:absolute;
    top:58px;
    right:30px;
    color:#fff;
    font-size:24px;
    letter-spacing:3px;
    text-shadow:2px 2px 4px #000;
}

#healthContainer{
    position:absolute;
    left:25px;
    bottom:25px;
    width:220px;
    height:22px;
    background:#222;
    border:2px solid #fff;
    border-radius:5px;
    overflow:hidden;
}

#healthBar{
    width:100%;
    height:100%;
    background:#28d34f;
}

#ammo{
    position:absolute;
    right:30px;
    bottom:25px;
    font-size:20px;
    text-shadow:2px 2px 4px #000;
}

#speedometer{
    position:absolute;
    right:30px;
    bottom:60px;
    font-size:22px;
    display:none;
}

#districtHud{
    position:absolute;
    left:50%;
    top:25px;
    transform:translateX(-50%);
    font-size:17px;
    letter-spacing:2px;
    text-shadow:2px 2px 4px #000;
}

#mission{
    position:absolute;
    left:25px;
    top:25px;
    font-size:18px;
    max-width:300px;
    text-shadow:2px 2px 4px #000;
}


/* ================================
   MINIMAP
================================ */

#minimap{
    position:absolute;
    right:25px;
    bottom:100px;
    width:190px;
    height:190px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.8);
    background:#111;
}


/* ================================
   CROSSHAIR
================================ */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
    display:none;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair::before{
    width:20px;
    height:2px;
    top:9px;
    left:0;
}

#crosshair::after{
    width:2px;
    height:20px;
    left:9px;
    top:0;
}


/* ================================
   MESSAGE
================================ */

#message{
    position:absolute;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);
    padding:12px 20px;
    background:rgba(0,0,0,.75);
    border-radius:7px;
    font-size:17px;
    display:none;
}


/* ================================
   DISTRICT NOTIFICATION
================================ */

#districtNotification{
    position:absolute;
    left:50%;
    top:90px;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:bold;
    letter-spacing:4px;
    opacity:0;
    transition:opacity .4s;
    text-shadow:2px 2px 5px #000;
}


/* ================================
   CONTROLS
================================ */

#controls{
    position:absolute;
    left:25px;
    bottom:60px;
    font-size:12px;
    color:rgba(255,255,255,.65);
}


/* ================================
   VEHICLE HUD
================================ */

#vehicleHud{
    position:absolute;
    right:25px;
    bottom:25px;
    display:none;
    font-size:13px;
    color:#ddd;
}

</style>

</head>

<body>

<div id="game"></div>


<!-- LOADING -->

<div id="loading">

    <h1>LOADING CITY</h1>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>

</div>


<!-- START -->

<div id="startScreen">

    <h1>OPEN WORLD</h1>

    <p>Explore the city, drive cars and complete missions.</p>

    <button id="startButton">
        START GAME
    </button>

</div>


<!-- HUD -->

<div id="hud">

    <div id="money">
        $2,500
    </div>

    <div id="wanted">
        ☆☆☆☆☆
    </div>

    <div id="districtHud">
        DOWNTOWN
    </div>

    <div id="mission">
        Mission: Explore Downtown
    </div>

    <div id="healthContainer">
        <div id="healthBar"></div>
    </div>

    <div id="ammo">
        12 / 60
    </div>

    <div id="speedometer">
        SPEED: <span id="speed">0</span>
    </div>

    <canvas
        id="minimap"
        width="190"
        height="190"
    ></canvas>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="districtNotification"></div>

    <div id="controls">
        WASD Move • SHIFT Run • E Enter/Exit • R Reload • Mouse Shoot
    </div>

    <div id="vehicleHud">
        W/S Drive • A/D Steer • E Exit
    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ==========================================
   GAME VARIABLES
========================================== */

let scene;
let camera;
let renderer;

let player;
let playerGroup;

let car;

let trafficCars = [];
let policeCars = [];
let npcs = [];
let shops = [];
let trafficLights = [];

let keys = {};

let gameStarted = false;
let pointerLocked = false;
let inCar = false;

let yaw = 0;
let pitch = -0.15;

let carSpeed = 0;

let playerHealth = 100;

let ammo = 12;
let reserveAmmo = 60;

let money = 2500;

let wantedLevel = 0;

let damageCooldown = 0;

let cameraShake = 0;

let currentDistrict =
    "DOWNTOWN";

let policeSpawnTimer = 0;

let wantedDecayTimer = 0;

let npcSpawnTimer = 0;

let eventTimer = 0;

let districtTimer;

let messageTimeout;

let activeMission = 0;

let missionCompleted = false;


/* ==========================================
   WORLD
========================================== */

const WORLD_SIZE = 900;

const ROAD_WIDTH = 24;

const BLOCK_SIZE = 80;


/* ==========================================
   SCENE
========================================== */

scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87b9df
    );


scene.fog =
    new THREE.Fog(
        0x87b9df,
        280,
        850
    );


camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1200
    );


camera.position.set(
    0,
    5,
    10
);


/* ==========================================
   RENDERER
========================================== */

renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.shadowMap.enabled =
    true;


document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* ==========================================
   LIGHTING
========================================== */

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x566b48,
        1.7
    );


scene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


sun.position.set(
    150,
    300,
    100
);


sun.castShadow =
    true;


sun.shadow.mapSize.width =
    2048;


sun.shadow.mapSize.height =
    2048;


scene.add(
    sun
);


/* ==========================================
   GROUND
========================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            WORLD_SIZE,
            WORLD_SIZE
        ),

        new THREE.MeshStandardMaterial({
            color:0x3e7142
        })

    );


ground.rotation.x =
    -Math.PI/2;


ground.receiveShadow =
    true;


scene.add(
    ground
);


/* ==========================================
   ROAD MATERIALS
========================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x292b2d
    });


const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x777777
    });


const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xe7d85b
    });


/* ==========================================
   ROAD CREATION
========================================== */

function createRoadX(
    z
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                WORLD_SIZE,
                .08,
                ROAD_WIDTH
            ),

            roadMaterial

        );


    road.position.set(
        0,
        .04,
        z
    );


    scene.add(
        road
    );


    /* sidewalks */

    const sidewalk1 =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                WORLD_SIZE,
                .12,
                5
            ),

            sidewalkMaterial

        );


    sidewalk1.position.set(
        0,
        .10,
        z - ROAD_WIDTH/2 - 2.5
    );


    scene.add(
        sidewalk1
    );


    const sidewalk2 =
        sidewalk1.clone();


    sidewalk2.position.z =
        z +
        ROAD_WIDTH/2 +
        2.5;


    scene.add(
        sidewalk2
    );


    /* road markings */

    for(
        let x=-WORLD_SIZE/2;
        x<WORLD_SIZE/2;
        x+=18
    ){

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    9,
                    .09,
                    .18
                ),

                lineMaterial

            );


        line.position.set(
            x,
            .11,
            z
        );


        scene.add(
            line
        );

    }

}


/* ==========================================
   ROAD CREATION Z
========================================== */

function createRoadZ(
    x
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                ROAD_WIDTH,
                .08,
                WORLD_SIZE
            ),

            roadMaterial

        );


    road.position.set(
        x,
        .04,
        0
    );


    scene.add(
        road
    );


    /* sidewalks */

    const sidewalk1 =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                5,
                .12,
                WORLD_SIZE
            ),

            sidewalkMaterial

        );


    sidewalk1.position.set(
        x - ROAD_WIDTH/2 - 2.5,
        .10,
        0
    );


    scene.add(
        sidewalk1
    );


    const sidewalk2 =
        sidewalk1.clone();


    sidewalk2.position.x =
        x +
        ROAD_WIDTH/2 +
        2.5;


    scene.add(
        sidewalk2
    );


    /* road markings */

    for(
        let z=-WORLD_SIZE/2;
        z<WORLD_SIZE/2;
        z+=18
    ){

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .18,
                    .09,
                    9
                ),

                lineMaterial

            );


        line.position.set(
            x,
            .11,
            z
        );


        scene.add(
            line
        );

    }

}


/* ==========================================
   CITY ROAD NETWORK
========================================== */

/*
   IMPORTANT:
   These roads run ALL the way across
   the map. Buildings will NEVER be
   placed on these road corridors.
*/

const roadPositions = [
    -320,
    -240,
    -160,
    -80,
    0,
    80,
    160,
    240,
    320
];


roadPositions.forEach(
    z => {

        createRoadX(
            z
        );

    }
);


roadPositions.forEach(
    x => {

        createRoadZ(
            x
        );

    }
);


/* ==========================================
   BUILDING MATERIALS
========================================== */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color:0x8b7d72
    }),

    new THREE.MeshStandardMaterial({
        color:0x6c7480
    }),

    new THREE.MeshStandardMaterial({
        color:0x987c63
    }),

    new THREE.MeshStandardMaterial({
        color:0x52626b
    }),

    new THREE.MeshStandardMaterial({
        color:0x795b50
    })

];


/* ==========================================
   BUILDING TEST
========================================== */

function isRoadArea(
    x,
    z
){

    for(
        const road of roadPositions
    ){

        if(
            Math.abs(
                x - road
            ) <
            ROAD_WIDTH/2 + 8
        ){

            return true;

        }


        if(
            Math.abs(
                z - road
            ) <
            ROAD_WIDTH/2 + 8
        ){

            return true;

        }

    }


    return false;

}


/* ==========================================
   CREATE BUILDING
========================================== */

function createBuilding(
    x,
    z,
    width,
    depth,
    height
){

    /*
       Absolute protection:
       Buildings cannot be created
       on roads.
    */

    if(
        isRoadArea(
            x,
            z
        )
    ){

        return;

    }


    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    building.position.set(
        x,
        height/2,
        z
    );


    building.castShadow =
        true;


    building.receiveShadow =
        true;


    scene.add(
        building
    );


    /* windows */

    const windowMaterial =
        new THREE.MeshBasicMaterial({
            color:0x9ec5d8
        });


    const windowRows =
        Math.max(
            1,
            Math.floor(
                height/4
            )
        );


    const windowColumns =
        Math.max(
            2,
            Math.floor(
                width/5
            )
        );


    for(
        let row=0;
        row<windowRows;
        row++
    ){

        for(
            let col=0;
            col<windowColumns;
            col++
        ){

            const windowMesh =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        1.4,
                        1.2,
                        .08
                    ),

                    windowMaterial

                );


            const wx =
                x -
                width/2 +
                2.5 +
                col*4.5;


            const wy =
                2 +
                row*4;


            const wz =
                z -
                depth/2 -
                .05;


            windowMesh.position.set(
                wx,
                wy,
                wz
            );


            scene.add(
                windowMesh
            );

        }

    }

}


/* ==========================================
   CITY BLOCKS
========================================== */

function generateCity(){

    /*
       Each block sits BETWEEN roads.
       Therefore every road remains open.
    */

    for(
        let ix=0;
        ix<roadPositions.length-1;
        ix++
    ){

        for(
            let iz=0;
            iz<roadPositions.length-1;
            iz++
        ){

            const x1 =
                roadPositions[ix];


            const x2 =
                roadPositions[ix+1];


            const z1 =
                roadPositions[iz];


            const z2 =
                roadPositions[iz+1];


            const centerX =
                (x1+x2)/2;


            const centerZ =
                (z1+z2)/2;


            const blockWidth =
                Math.abs(
                    x2-x1
                ) -
                ROAD_WIDTH -
                18;


            const blockDepth =
                Math.abs(
                    z2-z1
                ) -
                ROAD_WIDTH -
                18;


            /*
               One or two buildings per block.
            */

            const split =
                Math.random();


            if(
                split < .55
            ){

                createBuilding(
                    centerX -
                    blockWidth*.18,
                    centerZ,
                    blockWidth*.48,
                    blockDepth*.75,
                    12 +
                    Math.random()*30
                );


                createBuilding(
                    centerX +
                    blockWidth*.22,
                    centerZ,
                    blockWidth*.35,
                    blockDepth*.55,
                    8 +
                    Math.random()*22
                );

            }
            else{

                createBuilding(
                    centerX,
                    centerZ,
                    blockWidth*.78,
                    blockDepth*.72,
                    10 +
                    Math.random()*35
                );

            }

        }

    }

}


generateCity();


/* ==========================================
   CITY PARK
========================================== */

function createPark(
    x,
    z,
    size
){

    const park =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                size,
                .15,
                size
            ),

            new THREE.MeshStandardMaterial({
                color:0x43804a
            })

        );


    park.position.set(
        x,
        .08,
        z
    );


    scene.add(
        park
    );


    for(
        let i=0;
        i<10;
        i++
    ){

        const tree =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .35,
                    .45,
                    3,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color:0x68442c
                })

            );


        trunk.position.y =
            1.5;


        tree.add(
            trunk
        );


        const leaves =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.8,
                    10,
                    10
                ),

                new THREE.MeshStandardMaterial({
                    color:0x246b32
                })

            );


        leaves.position.y =
            4;


        tree.add(
            leaves
        );


        tree.position.set(

            x +
            (Math.random()-.5) *
            (size-8),

            0,

            z +
            (Math.random()-.5) *
            (size-8)

        );


        scene.add(
            tree
        );

    }

}

createPark(
    -120,
    -120,
    45
);

createPark(
    120,
    120,
    45
);



const skinMaterial =
    new THREE.MeshStandardMaterial({
        color:0xc68663
    });

const shirtMaterial =
    new THREE.MeshStandardMaterial({
        color:0x24558c
    });

const pantsMaterial =
    new THREE.MeshStandardMaterial({
        color:0x20242a
    });

const shoeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x111111
    });


function createPlayer(){

    const group =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .9,
                1.35,
                .52
            ),

            shirtMaterial
        );


    body.position.y =
        2.15;


    body.castShadow =
        true;


    group.add(
        body
    );


    /* HEAD */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .36,
                16,
                16
            ),

            skinMaterial
        );


    head.position.y =
        3.15;


    head.castShadow =
        true;


    group.add(
        head
    );


    /* NECK */

    const neck =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .13,
                .13,
                .25,
                10
            ),

            skinMaterial
        );


    neck.position.y =
        2.72;


    group.add(
        neck
    );


    /* LEFT ARM */

    const leftArm =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .13,
                .11,
                1.25,
                10
            ),

            shirtMaterial
        );


    leftArm.position.set(
        -.6,
        2.15,
        0
    );


    leftArm.rotation.z =
        -.08;


    leftArm.castShadow =
        true;


    group.add(
        leftArm
    );


    /* RIGHT ARM */

    const rightArm =
        leftArm.clone();


    rightArm.position.x =
        .6;


    rightArm.rotation.z =
        .08;


    group.add(
        rightArm
    );


    /* LEFT LEG */

    const leftLeg =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .16,
                .14,
                1.45,
                10
            ),

            pantsMaterial
        );


    leftLeg.position.set(
        -.23,
        .75,
        0
    );


    leftLeg.castShadow =
        true;


    group.add(
        leftLeg
    );


    /* RIGHT LEG */

    const rightLeg =
        leftLeg.clone();


    rightLeg.position.x =
        .23;


    group.add(
        rightLeg
    );


    /* SHOES */

    const leftShoe =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .32,
                .16,
                .6
            ),

            shoeMaterial
        );


    leftShoe.position.set(
        -.23,
        .05,
        -.12
    );


    group.add(
        leftShoe
    );


    const rightShoe =
        leftShoe.clone();


    rightShoe.position.x =
        .23;


    group.add(
        rightShoe
    );


    group.userData.leftArm =
        leftArm;

    group.userData.rightArm =
        rightArm;

    group.userData.leftLeg =
        leftLeg;

    group.userData.rightLeg =
        rightLeg;

    group.userData.walkTime =
        0;


    return group;

}


playerGroup =
    createPlayer();


player =
    playerGroup;


playerGroup.position.set(
    0,
    0,
    35
);


scene.add(
    playerGroup
);


/* ==========================================
   CAR CREATION
========================================== */

function createCar(
    bodyColor,
    roofColor
){

    const group =
        new THREE.Group();


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color:bodyColor,
            metalness:.35,
            roughness:.45
        });


    const roofMaterial =
        new THREE.MeshStandardMaterial({

/* ==========================================
   TRAFFIC MOVEMENT
========================================== */

function updateTraffic(
    dt
){

    trafficCars.forEach(
        traffic => {

            const direction =
                new THREE.Vector3(
                    0,
                    0,
                    -1
                );


            direction.applyQuaternion(
                traffic.quaternion
            );


            traffic.position.add(
                direction.multiplyScalar(
                    traffic.userData.speed *
                    dt
                )
            );


            /*
               Wrap traffic around map
               instead of allowing cars to
               disappear permanently.
            */

            const limit =
                WORLD_SIZE/2 +
                30;


            if(
                traffic.position.x >
                limit
            ){

                traffic.position.x =
                    -limit;

            }


            if(
                traffic.position.x <
                -limit
            ){

                traffic.position.x =
                    limit;

            }


            if(
                traffic.position.z >
                limit
            ){

                traffic.position.z =
                    -limit;

            }


            if(
                traffic.position.z <
                -limit
            ){

                traffic.position.z =
                    limit;

            }


            if(
                traffic.userData.wheels
            ){

                traffic.userData.wheels
                    .forEach(
                        wheel => {

                            wheel.children[0]
                                .rotation.x +=
                                traffic.userData.speed *
                                dt *
                                1.8;

                        }
                    );

            }

        }
    );

}

/* ==========================================
   PLAYER MOVEMENT
========================================== */

function updatePlayer(
    dt
){

    if(
        inCar ||
        !gameStarted
    ){
        return;
    }


    let forward = 0;
    let side = 0;


    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    ){

        forward += 1;

    }


    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    ){

        forward -= 1;

    }


    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ){

        side -= 1;

    }


    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ){

        side += 1;

    }


    if(
        forward === 0 &&
        side === 0
    ){

        return;

    }


    const direction =
        new THREE.Vector3(
            side,
            0,
            -forward
        );


    direction.normalize();


    direction.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
        ? 15
        : 8;


    playerGroup.position.add(
        direction.multiplyScalar(
            speed * dt
        )
    );


    player.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


    /* walking animation */

    playerGroup.userData.walkTime +=
        dt *
        9;


    const swing =
        Math.sin(
            playerGroup.userData.walkTime
        ) *
        .65;


    playerGroup.userData.leftLeg
        .rotation.x =
        swing;


    playerGroup.userData.rightLeg
        .rotation.x =
        -swing;


    playerGroup.userData.leftArm
        .rotation.x =
        -swing*.65;


    playerGroup.userData.rightArm
        .rotation.x =
        swing*.65;


    /* map bounds */

    const limit =
        WORLD_SIZE/2 -
        8;


    playerGroup.position.x =
        THREE.MathUtils.clamp(
            playerGroup.position.x,
            -limit,
            limit
        );


    playerGroup.position.z =
        THREE.MathUtils.clamp(
            playerGroup.position.z,
            -limit,
            limit
        );

}


/* ==========================================
   CAR MOVEMENT
========================================== */

function updatePlayerCar(
    dt
){

    if(
        !inCar ||
        !gameStarted
    ){
        return;
    }


    const acceleration =
        27;


    const brake =
        34;


    const maxSpeed =
        55;


    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    ){

        carSpeed +=
            acceleration *
            dt;

    }


    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    ){

        carSpeed -=
            brake *
            dt;

    }


    if(
        !keys["KeyW"] &&
        !keys["ArrowUp"] &&
        !keys["KeyS"] &&
        !keys["ArrowDown"]
    ){

        carSpeed *=
            Math.pow(
                .975,
                dt*60
            );

    }


    carSpeed =
        THREE.MathUtils.clamp(
            carSpeed,
            -18,
            maxSpeed
        );


    let steering = 0;


    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ){

        steering += 1;

    }


    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ){

        steering -= 1;

    }


    const steeringStrength =
        Math.min(
            Math.abs(carSpeed)/10,
            1
        );


    car.rotation.y +=
        steering *
        1.5 *
        steeringStrength *
        dt *
        (
            carSpeed >= 0
            ? 1
            : -1
        );


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        car.quaternion
    );


    car.position.add(
        direction.multiplyScalar(
            carSpeed *
            dt
        )
    );


    const limit =
        WORLD_SIZE/2 -
        10;


    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -limit,
            limit
        );


    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -limit,
            limit
        );


    playerGroup.position.copy(
        car.position
    );


    if(
        car.userData.wheels
    ){

        car.userData.wheels
            .forEach(
                wheel => {

                    wheel.children[0]
                        .rotation.x +=
                        carSpeed *
                        dt *
                        1.8;

                }
            );

    }


    updateSpeedUI();

}

function enterCar(){

        playerGroup.position.distanceTo(
            car.position
        );

        distance > 9
    ){

        showMessage(
            "Get closer to your car"
        );

        return;

    inCar =
        true;


    player.visible =
        false;


    document

        )
        .style.display =

    document

        )
        .style.display =

    showMessage(
        "W/S drive • A/D steer • E exit"
    );

}


function exitCar(){

    inCar =
        false;


    player.visible =
        true;


    const side =
        new THREE.Vector3(
            Math.cos(
                car.rotation.y
            ),
            0,
            -Math.sin(
                car.rotation.y
            )
        );


    playerGroup.position.copy(
        car.position
    );


    playerGroup.position.add(
        side.multiplyScalar(
            5
        )
    );


    carSpeed =
        0;


    document
        .getElementById(
            "speedometer"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "vehicleHud"
        )
        .style.display =
        "none";

}

            })

    );

        );

            1,

    );

function reload(){

    const missing =
        12 -
        ammo;


    if(
        missing <= 0 ||
        reserveAmmo <= 0
    ){

        return;

    }


    const amount =
        Math.min(
            missing,
            reserveAmmo
        );


    ammo +=
        amount;


    reserveAmmo -=
        amount;


    updateAmmoUI();

}

/* ==========================================
   WANTED SYSTEM
========================================== */

function increaseWanted(
    amount=1
){

    wantedLevel =
        Math.min(
            5,
            wantedLevel +
            amount
        );


    wantedDecayTimer =
        0;


    updateWantedUI();

}


function updateWantedDecay(
    dt
){

    if(
        wantedLevel <= 0
    ){

        return;

    }


    wantedDecayTimer +=
        dt;


    if(
        wantedDecayTimer > 30
    ){

        wantedLevel--;

        wantedDecayTimer =
            0;

        updateWantedUI();

        if(
            wantedLevel === 0
        ){

            showMessage(
                "You lost the police."
            );

        }

    }

}


/* ==========================================
   POLICE AI
========================================== */

function updatePolice(
    dt
){

    policeCars.forEach(
        police => {

            const target =
                inCar
                ? car.position
                : playerGroup.position;


            const distance =
                police.position.distanceTo(
                    target
                );


            if(
                wantedLevel > 0 &&
                distance < 220
            ){

                const direction =
                    new THREE.Vector3()
                        .subVectors(
                            target,
                            police.position
                        );


                direction.y =
                    0;


                if(
                    direction.length() >
                    .5
                ){

                    direction.normalize();


                    const targetAngle =
                        Math.atan2(
                            direction.x,
                            direction.z
                        );


                    let difference =
                        targetAngle -
                        police.rotation.y;


                    while(
                        difference >
                        Math.PI
                    ){

                        difference -=
                            Math.PI*2;

                    }


                    while(
                        difference <
                        -Math.PI
                    ){

                        difference +=
                            Math.PI*2;

                    }


                    police.rotation.y +=
                        difference *
                        Math.min(
                            dt*3,
                            1
                        );


                    police.position.add(
                        direction.multiplyScalar(
                            (
                                police.userData.speed +
                                wantedLevel*2
                            ) *
                            dt
                        )
                    );

                }


                if(
                    distance < 7
                ){

                    playerHealth -=
                        12 *
                        dt;


                    updateHealthUI();


                    addCameraShake(
                        .15
                    );


                    if(
                        playerHealth <= 0
                    ){

                        playerHealth =
                            100;

                        wantedLevel =
                            0;

                        playerGroup.position.set(
                            0,
                            0,
                            35
                        );

                        car.position.set(
                            0,
                            0,
                            15
                        );

                        carSpeed =
                            0;

                        updateWantedUI();
                        updateHealthUI();

                        showMessage(
                            "You escaped."
                        );

                    }

                }

            }


            /* police lights */

            if(
                police.userData.red &&
                police.userData.blue
            ){

                const flash =
                    Math.floor(
                        performance.now()/180
                    ) % 2;


                police.userData.red
                    .visible =
                    flash === 0;


                police.userData.blue
                    .visible =
                    flash === 1;

            }

        }
    );

}


/* ==========================================
   NPC CREATION
========================================== */

const npcShirtColors = [
    0x263238,
    0x8e24aa,
    0x1565c0,
    0xd84315,
    0x2e7d32,
    0x6d4c41,
    0xc62828,
    0x37474f
];

const npcSkinColors = [
    0xb87958,
    0xc98b68,
    0x8d5524,
    0xe0a17a
];


function createNPC(){

    const npc =
        new THREE.Group();

    const skin =
        new THREE.MeshStandardMaterial({
            color:
                npcSkinColors[
                    Math.floor(
                        Math.random() *
                        npcSkinColors.length
                    )
                ]
        });

    const shirt =
        new THREE.MeshStandardMaterial({
            color:
                npcShirtColors[
                    Math.floor(
                        Math.random() *
                        npcShirtColors.length
                    )
                ]
        });

    const pants =
        new THREE.MeshStandardMaterial({
            color:0x252525
        });


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .72,
                1.15,
                .45
            ),
            shirt
        );

    body.position.y =
        1.85;

    body.castShadow =
        true;

    npc.add(body);


    /* HEAD */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .3,
                12,
                12
            ),
            skin
        );

    head.position.y =
        2.75;

    head.castShadow =
        true;

    npc.add(head);


    /* ARMS */

    const armGeometry =
        new THREE.CylinderGeometry(
            .1,
            .09,
            1,
            8
        );

    const leftArm =
        new THREE.Mesh(
            armGeometry,
            shirt
        );

    leftArm.position.set(
        -.47,
        1.85,
        0
    );

    leftArm.rotation.z =
        -.08;

    npc.add(leftArm);


    const rightArm =
        leftArm.clone();

    rightArm.position.x =
        .47;

    rightArm.rotation.z =
        .08;

    npc.add(rightArm);


    /* LEGS */

    const legGeometry =
        new THREE.CylinderGeometry(
            .12,
            .11,
            1.25,
            8
        );

    const leftLeg =
        new THREE.Mesh(
            legGeometry,
            pants
        );

    leftLeg.position.set(
        -.18,
        .62,
        0
    );

    npc.add(leftLeg);


    const rightLeg =
        leftLeg.clone();

    rightLeg.position.x =
        .18;

    npc.add(rightLeg);


    npc.userData.leftArm =
        leftArm;

    npc.userData.rightArm =
        rightArm;

    npc.userData.leftLeg =
        leftLeg;

    npc.userData.rightLeg =
        rightLeg;

    npc.userData.walkTime =
        Math.random() * 10;

    npc.userData.speed =
        1.2 +
        Math.random()*1.3;

    npc.userData.panic =
        false;

    npc.userData.panicTime =
        0;

    npc.userData.target =
        null;

    return npc;

}


/* ==========================================
   SAFE NPC SPAWN
========================================== */

function spawnNPC(){

    const npc =
        createNPC();

    let x;
    let z;

    const horizontal =
        Math.random() <
        .5;

    const road =
        roadPositions[
            Math.floor(
                Math.random() *
                roadPositions.length
            )
        ];

    if(horizontal){

        x =
            road +
            (
                Math.random()-.5
            ) *
            7;

        z =
            (
                Math.random()-.5
            ) *
            WORLD_SIZE;

    }
    else{

        x =
            (
                Math.random()-.5
            ) *
            WORLD_SIZE;

        z =
            road +
            (
                Math.random()-.5
            ) *
            7;

    }

    npc.position.set(
        x,
        0,
        z
    );

    scene.add(
        npc
    );

    npcs.push(
        npc
    );

}


/* ==========================================
   INITIAL NPCS
========================================== */

for(
    let i=0;
    i<55;
    i++
){

}


/* ==========================================
   NPC PANIC
========================================== */

function panicNearbyNPCs(){

    npcs.forEach(
        npc => {

            const distance =
                npc.position.distanceTo(
                    playerGroup.position
                );

            if(
                distance < 100
            ){

                npc.userData.panic =
                    true;

                npc.userData.panicTime =
                    8;

                const direction =
                    new THREE.Vector3()
                        .subVectors(
                            npc.position,
                            playerGroup.position
                        );

                direction.y =
                    0;

                if(
                    direction.length() >
                    .1
                ){

                    direction.normalize();

                    npc.userData.target =
                        npc.position.clone()
                            .add(
                                direction.multiplyScalar(
                                    60
                                )
                            );

                }

            }

        }
    );

}


/* ==========================================
   NPC MOVEMENT
========================================== */

function updateNPCs(
    dt
){

    npcs.forEach(
        npc => {

            npc.userData.walkTime +=
                dt *
                npc.userData.speed *
                3;

            let direction =
                new THREE.Vector3();


            if(
                npc.userData.panic &&
                npc.userData.target
            ){

                npc.userData.panicTime -=
                    dt;

                direction
                    .subVectors(
                        npc.userData.target,
                        npc.position
                    );

                if(
                    npc.userData.panicTime <= 0 ||
                    direction.length() < 5
                ){

                    npc.userData.panic =
                        false;

                }

            }


            if(
                !npc.userData.panic
            ){

                const angle =
                    Math.sin(
                        npc.userData.walkTime*.15
                    ) *
                    Math.PI;

                direction.set(
                    Math.sin(angle),
                    0,
                    Math.cos(angle)
                );

            }


            if(
                direction.length() >
                .05
            ){

                direction.normalize();

                npc.position.add(
                    direction.multiplyScalar(
                        (
                            npc.userData.panic
                            ? 5
                            : npc.userData.speed
                        ) *
                        dt
                    )
                );

                npc.rotation.y =
                    Math.atan2(
                        direction.x,
                        direction.z
                    );

            }


            const swing =
                Math.sin(
                    npc.userData.walkTime
                )*.45;

            npc.userData.leftLeg
                .rotation.x =
                swing;

            npc.userData.rightLeg
                .rotation.x =
                -swing;

            npc.userData.leftArm
                .rotation.x =
                -swing*.7;

            npc.userData.rightArm
                .rotation.x =
                swing*.7;


            const limit =
                WORLD_SIZE/2 - 5;

            npc.position.x =
                THREE.MathUtils.clamp(
                    npc.position.x,
                    -limit,
                    limit
                );

            npc.position.z =
                THREE.MathUtils.clamp(
                    npc.position.z,
                    -limit,
                    limit
                );

        }
    );

}

/* ==========================================
   DISTRICTS
========================================== */

function getDistrict(
    x,
    z
){

    if(
        Math.abs(x) < 120 &&
        Math.abs(z) < 120
    ){

        return "DOWNTOWN";

    }


    if(
        x < -120 &&
        z < 120
    ){

        return "WESTSIDE";

    }


    if(
        x > 120 &&
        z < 120
    ){

        return "EASTSIDE";

    }


    if(
        x < -120 &&
        z >= 120
    ){

        return "HARBOR";

    }


    if(
        x >= 120 &&
        z >= 120
    ){

        return "UPTOWN";

    }


    return "SUBURBS";

}


/* ==========================================
   DISTRICT UPDATE
========================================== */

function updateDistrict(){

    const position =
        inCar
        ? car.position
        : playerGroup.position;

    const district =
        getDistrict(
            position.x,
            position.z
        );

    if(
        district !== currentDistrict
    ){

        currentDistrict =
            district;

        document
            .getElementById(
                "districtHud"
            )
            .textContent =
            district;

        showDistrictNotification(
            district
        );

    }

}


/* ==========================================
   DISTRICT NOTIFICATION
========================================== */

function showDistrictNotification(
    district
){

    const element =
        document.getElementById(
            "districtNotification"
        );

    element.textContent =
        district;

    element.style.opacity =
        "1";

    clearTimeout(
        districtTimer
    );

    districtTimer =
        setTimeout(
            () => {

                element.style.opacity =
                    "0";

            },
            2500
        );

}


/* ==========================================
   CAMERA
========================================== */

function updateCamera(){

    if(
        inCar
    ){

        const target =
            car.position.clone();

        target.y +=
            2.4;


        const distance =
            12;


        const offset =
            new THREE.Vector3(
                0,
                4.5,
                distance
            );


        offset.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            car.rotation.y
        );


        camera.position.lerp(
            target.clone().add(
                offset
            ),
            .1
        );


        camera.lookAt(
            target
        );

        return;

    }


    const target =
        playerGroup.position.clone();

    target.y +=
        2.5;


    const offset =
        new THREE.Vector3(
            0,
            1.5,
            7
        );


    offset.applyAxisAngle(
        new THREE.Vector3(
            1,
            0,
            0
        ),
        pitch
    );


    offset.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    const desired =
        target.clone().add(
            offset
        );


    camera.position.lerp(
        desired,
        .12
    );


    camera.lookAt(
        target
    );


    if(
        cameraShake > 0
    ){

        camera.position.x +=
            (
                Math.random()-.5
            ) *
            cameraShake;

        camera.position.y +=
            (
                Math.random()-.5
            ) *
            cameraShake;

        camera.position.z +=
            (
                Math.random()-.5
            ) *
            cameraShake;

    }

}


/* ==========================================
   CAMERA SHAKE
========================================== */

function addCameraShake(
    amount
){

    cameraShake =
        Math.max(
            cameraShake,
            amount
        );

}


/* ==========================================
   MINIMAP
========================================== */

const minimap =
    document.getElementById(
        "minimap"
    );

const mapCtx =
    minimap.getContext(
        "2d"
    );


function drawMinimap(){

    const width =
        minimap.width;

    const height =
        minimap.height;


    mapCtx.clearRect(
        0,
        0,
        width,
        height
    );


    mapCtx.fillStyle =
        "#203824";

    mapCtx.fillRect(
        0,
        0,
        width,
        height
    );


    const scale =
        width /
        WORLD_SIZE;


    /* roads */

    mapCtx.fillStyle =
        "#454545";


    roadPositions.forEach(
        road => {

            const p =
                (road +
                WORLD_SIZE/2) *
                scale;


            mapCtx.fillRect(
                0,
                p - 3,
                width,
                6
            );


            mapCtx.fillRect(
                p - 3,
                0,
                6,
                height
            );

        }
    );


    /* player */

    const position =
        inCar
        ? car.position
        : playerGroup.position;


    const px =
        (
            position.x +
            WORLD_SIZE/2
        ) *
        scale;


    const pz =
        (
            position.z +
            WORLD_SIZE/2
        ) *
        scale;


    mapCtx.fillStyle =
        "#28d34f";


    mapCtx.beginPath();

    mapCtx.arc(
        px,
        pz,
        5,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    /* police */

    mapCtx.fillStyle =
        "#ff3333";


    policeCars.forEach(
        police => {

            const x =
                (
                    police.position.x +
                    WORLD_SIZE/2
                ) *
                scale;

            const z =
                (
                    police.position.z +
                    WORLD_SIZE/2
                ) *
                scale;

            mapCtx.fillRect(
                x-2,
                z-2,
                4,
                4
            );

        }
    );

}


/* ==========================================
   MISSION SYSTEM
========================================== */

const missions = [

    {
        title:
            "Explore Downtown",

        reward:
            500
    },

    {
        title:
            "Visit the Auto Shop",

        reward:
            750
    },

    {
        title:
            "Reach the Harbor",

        reward:
            1000
    },

    {
        title:
            "Lose the Police",

        reward:
            1500
    }

];


function updateMission(){

    const mission =
        missions[
            activeMission
        ];


    if(
        !mission
    ){

        document
            .getElementById(
                "mission"
            )
            .textContent =
            "All missions completed!";

        return;

    }


    document
        .getElementById(
            "mission"
        )
        .textContent =
        "Mission: " +
        mission.title;

}


/* ==========================================
   MISSION CHECK
========================================== */

function checkMission(){

    const position =
        inCar
        ? car.position
        : playerGroup.position;


    if(
        activeMission === 0 &&
        currentDistrict ===
        "DOWNTOWN"
    ){

        completeMission();

    }


    if(
        activeMission === 1 &&
        position.distanceTo(
            new THREE.Vector3(
                120,
                0,
                89
            )
        ) < 30
    ){

        completeMission();

    }


    if(
        activeMission === 2 &&
        currentDistrict ===
        "HARBOR"
    ){

        completeMission();

    }


    if(
        activeMission === 3 &&
        wantedLevel === 0
    ){

        completeMission();

    }

}


/* ==========================================
   COMPLETE MISSION
========================================== */

function completeMission(){

    if(
        missionCompleted
    ){

        return;

    }


    missionCompleted =
        true;


    const mission =
        missions[
            activeMission
        ];


    money +=
        mission.reward;


    document
        .getElementById(
            "money"
        )
        .textContent =
        "$" +
        money.toLocaleString();


    showMessage(
        "MISSION COMPLETE +$" +
        mission.reward
    );


    activeMission++;


    setTimeout(
        () => {

            missionCompleted =
                false;

            updateMission();

        },
        2500
    );

}


/* ==========================================
   COLLISION / DAMAGE
========================================== */

function checkVehicleCollisions(){

    if(
        !inCar
    ){

        return;

    }


    trafficCars.forEach(
        traffic => {

            const distance =
                car.position.distanceTo(
                    traffic.position
                );


            if(
                distance < 5
            ){

                if(
                    damageCooldown <= 0
                ){

                    playerHealth -=
                        8;

                    damageCooldown =
                        .7;

                    carSpeed *=
                        .55;

                    updateHealthUI();

                    addCameraShake(
                        .35
                    );

                    showMessage(
                        "Vehicle collision"
                    );

                }

            }

        }
    );

}


/* ==========================================
   DAMAGE TIMER
========================================== */

function updateDamage(
    dt
){

    if(
        damageCooldown > 0
    ){

        damageCooldown -=
            dt;

    }


    if(
        cameraShake > 0
    ){

        cameraShake *=
            .85;

        if(
            cameraShake <
            .01
        ){

            cameraShake =
                0;

        }

    }

}


/* ==========================================
   DAY / NIGHT
========================================== */

let worldTime =
    8;


function updateDayNight(
    dt
){

    worldTime +=
        dt *
        .015;


    if(
        worldTime >= 24
    ){

        worldTime =
            0;

    }


    const sunAngle =
        (
            worldTime -
            6
        ) /
        24 *
        Math.PI*2;


    sun.position.x =
        Math.cos(
            sunAngle
        ) *
        350;


    sun.position.y =
        Math.sin(
            sunAngle
        ) *
        350;


    sun.position.z =
        150;


    if(
        worldTime >= 18 ||
        worldTime < 6
    ){

        scene.background.set(
            0x10182d
        );

        scene.fog.color.set(
            0x10182d
        );

        ambientLight.intensity =
            .45;

        sun.intensity =
            .45;

    }
    else{

        scene.background.set(
            0x87b9df
        );

        scene.fog.color.set(
            0x87b9df
        );

        ambientLight.intensity =
            1.7;

        sun.intensity =
            2;

    }

}


/* ==========================================
   LOADING
========================================== */

    0;


const loadingInterval =
    setInterval(
        () => {

            loadingProgress +=
                Math.random()*12;


            if(
                loadingProgress >= 100
            ){

                loadingProgress =
                    100;

                clearInterval(
                    loadingInterval
                );


                document
                    .getElementById(
                        "loadingProgress"
                    )
                    .style.width =
                    "100%";

                    () => {

                        document
                            .getElementById(
                                "loading"
                            )
                            .style.display =
                            "none";


                        document
                            .getElementById(
                                "startScreen"
                            )
                            .style.display =
                            "flex";

                    },
                    500
                );

            }


            document
                .getElementById(
                    "loadingProgress"
                )
                .style.width =
                loadingProgress +
                "%";


        },
        120
    );


/* ==========================================
   GAME LOOP
========================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameStarted
    ){

        updatePlayer(
            dt
        );

        updatePlayerCar(
            dt
        );

        updateTraffic(
            dt
        );

        updateNPCs(
            dt
        );

        updatePolice(
            dt
        );

        updateWantedDecay(
            dt
        );

        updateDamage(
            dt
        );

        updateDistrict();

        checkMission();

        checkVehicleCollisions();

        updateDayNight(
            dt
        );

    }


    updateCamera();

    drawMinimap();


    renderer.render(
        scene,
        camera
    );

}


animate();

========================================== */

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

   INITIAL UI
========================================== */

updateHealthUI();
updateAmmoUI();
updateWantedUI();
updateMission();

========================================== */

            event.code ===

        ){

            if(

            ){

);
