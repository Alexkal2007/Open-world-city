<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/path/to/your/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World City</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#10151b;
    color:white;
}

#loading h1{
    font-size:42px;
    margin-bottom:25px;
    letter-spacing:3px;
}

#loadingBar{
    width:420px;
    max-width:80%;
    height:16px;
    border:2px solid #555;
    border-radius:20px;
    overflow:hidden;
}

#loadingProgress{
    width:0%;
    height:100%;
    background:#168cff;
    transition:.2s;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:90;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    background:
        linear-gradient(#0008,#000b),
        linear-gradient(135deg,#162b3d,#111);
    text-align:center;
}

#startScreen h1{
    font-size:52px;
    margin-bottom:12px;
    text-shadow:0 4px 15px #000;
}

#startScreen p{
    margin-bottom:25px;
    color:#ddd;
}

#startButton{
    padding:15px 38px;
    border:0;
    border-radius:8px;
    background:#168cff;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 4px #000;
}

#topLeft{
    position:absolute;
    left:20px;
    top:20px;
}

#district{
    font-size:26px;
    font-weight:bold;
}

#mission{
    margin-top:8px;
    font-size:15px;
}

#money{
    margin-top:7px;
    font-size:20px;
}

#healthOuter{
    margin-top:8px;
    width:220px;
    height:14px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

#health{
    width:100%;
    height:100%;
    background:#29d45b;
}

#topRight{
    position:absolute;
    top:20px;
    right:20px;
    text-align:right;
}

#wanted{
    color:#ffd21c;
    font-size:25px;
}

#ammo{
    margin-top:8px;
}

#speed{
    margin-top:8px;
}

#message{
    display:none;
    position:absolute;
    left:50%;
    bottom:15%;
    transform:translateX(-50%);
    background:#000c;
    padding:12px 22px;
    border-radius:8px;
    font-size:17px;
}

#districtMessage{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:bold;
    opacity:0;
    transition:.4s;
}

#crosshair{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
}

#crosshair:after{
    width:20px;
    height:2px;
    top:9px;
}

#minimap{
    position:absolute;
    right:20px;
    bottom:20px;
    width:190px;
    height:190px;
    border:3px solid white;
    border-radius:50%;
    background:#335d38;
}

#controls{
    position:absolute;
    bottom:22px;
    left:22px;
    font-size:13px;
    color:#ddd;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <h1>LOADING CITY</h1>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>
</div>

<div id="startScreen">

    <h1>OPEN WORLD CITY</h1>

    <p>
        WASD / Arrow Keys — Move & Drive<br>
        E — Enter / Exit Vehicle<br>
        SHIFT — Sprint<br>
        Mouse — Camera<br>
        Click — Shoot<br>
        R — Reload
    </p>

    <button id="startButton">
        START GAME
    </button>

</div>

<div id="hud">

    <div id="topLeft">

        <div id="district">
            DOWNTOWN
        </div>

        <div id="mission">
            Mission: Explore Downtown
        </div>

        <div id="money">
            $0
        </div>

        <div id="healthOuter">
            <div id="health"></div>
        </div>

    </div>

    <div id="topRight">

        <div id="wanted">
            ☆☆☆☆☆
        </div>

        <div id="ammo">
            12 / 60
        </div>

        <div id="speed">
            0 km/h
        </div>

    </div>

    <div id="districtMessage"></div>

    <div id="message"></div>

    <canvas
        id="minimap"
        width="190"
        height="190">
    </canvas>

    <div id="crosshair"></div>

    <div id="controls">
        E: Vehicle / Shop &nbsp; | &nbsp;
        WASD: Move
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

"use strict";


/* =====================================================
   GAME VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let playerGroup;
let player;

let car;

let npcs=[];
let trafficCars=[];
let policeCars=[];

let shops=[];
let trafficLights=[];

let keys={};

let gameStarted=false;
let inCar=false;

let pointerLocked=false;

let playerHealth=100;

let ammo=12;
let reserveAmmo=60;

let money=0;

let wantedLevel=0;
let wantedTimer=0;

let carSpeed=0;

let cameraYaw=0;
let cameraPitch=-0.08;

let cameraShake=0;

let currentDistrict="";

let activeMission=0;

let missionCompleted=false;

let worldTime=10;

let messageTimer=0;

let npcSpawnTimer=0;


/* =====================================================
   WORLD
===================================================== */

const WORLD_SIZE=1000;

const ROAD_SIZE=24;

const SIDEWALK_SIZE=7;

const roadPositions=[];

for(
    let i=-450;
    i<=450;
    i+=90
){
    roadPositions.push(i);
}


/* =====================================================
   THREE.JS
===================================================== */

scene=new THREE.Scene();

scene.background=
    new THREE.Color(
        0x86b8d8
    );

scene.fog=
    new THREE.Fog(
        0x86b8d8,
        120,
        750
    );


camera=
    new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        1600
    );


renderer=
    new THREE.WebGLRenderer({
        antialias:true
    });


renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   LIGHTING
===================================================== */

const ambient=
    new THREE.HemisphereLight(
        0xcfe8ff,
        0x263522,
        1.8
    );

scene.add(
    ambient
);


const sun=
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    150,
    300,
    120
);

sun.castShadow=true;

scene.add(
    sun
);


/* =====================================================
   MATERIAL HELPER
===================================================== */

function material(
    color,
    roughness=.8,
    metalness=0
){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:roughness,
        metalness:metalness
    });

}


/* =====================================================
   BOX HELPER
===================================================== */

function createBox(
    width,
    height,
    depth,
    color
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material(color)
        );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    return mesh;

}


/* =====================================================
   GROUND
===================================================== */

const ground=
    createBox(
        WORLD_SIZE,
        .4,
        WORLD_SIZE,
        0x4c7b45
    );

ground.position.y=-.2;

scene.add(
    ground
);


/* =====================================================
   ROADS
===================================================== */

function createRoadNetwork(){

    for(
        const p of roadPositions
    ){

        const horizontal=
            createBox(
                WORLD_SIZE,
                .12,
                ROAD_SIZE,
                0x292d31
            );

        horizontal.position.set(
            0,
            .03,
            p
        );

        scene.add(
            horizontal
        );


        const vertical=
            createBox(
                ROAD_SIZE,
                .12,
                WORLD_SIZE,
                0x292d31
            );

        vertical.position.set(
            p,
            .035,
            0
        );

        scene.add(
            vertical
        );


        /* SIDEWALKS */

        const sideA=
            createBox(
                WORLD_SIZE,
                .22,
                SIDEWALK_SIZE,
                0xb4b0a7
            );

        sideA.position.set(
            0,
            .15,
            p-ROAD_SIZE/2-SIDEWALK_SIZE/2
        );

        scene.add(
            sideA
        );


        const sideB=
            sideA.clone();

        sideB.position.z=
            p+ROAD_SIZE/2+SIDEWALK_SIZE/2;

        scene.add(
            sideB
        );


        const sideC=
            createBox(
                SIDEWALK_SIZE,
                .22,
                WORLD_SIZE,
                0xb4b0a7
            );

        sideC.position.set(
            p-ROAD_SIZE/2-SIDEWALK_SIZE/2,
            .16,
            0
        );

        scene.add(
            sideC
        );


        const sideD=
            sideC.clone();

        sideD.position.x=
            p+ROAD_SIZE/2+SIDEWALK_SIZE/2;

        scene.add(
            sideD
        );


        /* ROAD LINES */

        for(
            let i=-480;
            i<480;
            i+=20
        ){

            const line=
                createBox(
                    9,
                    .035,
                    .18,
                    0xe6dca8
                );

            line.position.set(
                i,
                .11,
                p
            );

            scene.add(
                line
            );


            const line2=
                createBox(
                    .18,
                    .035,
                    9,
                    0xe6dca8
                );

            line2.position.set(
                p,
                .12,
                i
            );

            scene.add(
                line2
            );

        }

    }

}

createRoadNetwork();


/* =====================================================
   CROSSWALKS
===================================================== */

function createCrosswalk(
    x,
    z
){

    for(
        let i=-3;
        i<=3;
        i++
    ){

        const a=
            createBox(
                2.5,
                .035,
                .8,
                0xffffff
            );

        a.position.set(
            x+i*3,
            .2,
            z-ROAD_SIZE/2-1
        );

        scene.add(a);


        const b=a.clone();

        b.position.z=
            z+ROAD_SIZE/2+1;

        scene.add(b);


        const c=
            createBox(
                .8,
                .035,
                2.5,
                0xffffff
            );

        c.position.set(
            x-ROAD_SIZE/2-1,
            .21,
            z+i*3
        );

        scene.add(c);


        const d=c.clone();

        d.position.x=
            x+ROAD_SIZE/2+1;

        scene.add(d);

    }

}


for(
    const x of roadPositions
){

    for(
        const z of roadPositions
    ){

        if(
            Math.abs(x)<400 &&
            Math.abs(z)<400
        ){

            createCrosswalk(
                x,
                z
            );

        }

    }

}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingColors=[
    0x68757b,
    0x756b62,
    0x596a76,
    0x80776d,
    0x56656c,
    0x706f74
];


function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    color
){

    const group=
        new THREE.Group();


    const building=
        createBox(
            width,
            height,
            depth,
            color
        );

    building.position.y=
        height/2;

    group.add(
        building
    );


    const roof=
        createBox(
            width+1,
            .7,
            depth+1,
            0x303236
        );

    roof.position.y=
        height+.35;

    group.add(
        roof
    );


    /* WINDOWS */

    for(
        let y=3;
        y<height-1;
        y+=3
    ){

        for(
            let xx=-width/2+3;
            xx<width/2-2;
            xx+=5
        ){

            const window=
                createBox(
                    2,
                    1.2,
                    .08,
                    0x7faeba
                );

            window.position.set(
                xx,
                y,
                depth/2+.06
            );

            group.add(
                window
            );


            const back=
                window.clone();

            back.position.z=
                -depth/2-.06;

            group.add(
                back
            );

        }

    }


    group.position.set(
        x,
        0,
        z
    );

    scene.add(
        group
    );

}


/* =====================================================
   CITY BLOCKS
===================================================== */

for(
    let ix=0;
    ix<10;
    ix++
){

    for(
        let iz=0;
        iz<10;
        iz++
    ){

        const x=
            -405+
            ix*90;

        const z=
            -405+
            iz*90;


        if(
            Math.abs(x)<45 ||
            Math.abs(z)<45
        ){

            continue;

        }


        const width=
            48+
            Math.random()*18;

        const depth=
            45+
            Math.random()*18;

        const height=
            18+
            Math.random()*38;


        createBuilding(
            x,
            z,
            width,
            depth,
            height,
            buildingColors[
                (ix+iz)%
                buildingColors.length
            ]
        );

    }

}


/* =====================================================
   DISTRICTS
===================================================== */

const districts=[

    {
        name:"DOWNTOWN",
        x:0,
        z:0
    },

    {
        name:"WESTSIDE",
        x:-225,
        z:-225
    },

    {
        name:"EASTSIDE",
        x:225,
        z:-225
    },

    {
        name:"HARBOR",
        x:-225,
        z:225
    },

    {
        name:"UPTOWN",
        x:225,
        z:225
    },

    {
        name:"SUBURBS",
        x:0,
        z:360
    }

];


function getDistrict(
    x,
    z
){

    if(
        Math.abs(x)<120 &&
        Math.abs(z)<120
    ){
        return "DOWNTOWN";
    }

    if(
        x<-120 &&
        z<-120
    ){
        return "WESTSIDE";
    }

    if(
        x>120 &&
        z<-120
    ){
        return "EASTSIDE";
    }

    if(
        x<-120 &&
        z>120
    ){
        return "HARBOR";
    }

    if(
        x>120 &&
        z>120
    ){
        return "UPTOWN";
    }

    return "SUBURBS";

}


/* =====================================================
   TEXT SPRITE
===================================================== */

function createTextSprite(
    text
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=800;
    canvas.height=180;


    const ctx=
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        800,
        180
    );


    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font=
        "bold 70px Arial";

    ctx.fillStyle=
        "white";

    ctx.strokeStyle=
        "black";

    ctx.lineWidth=12;


    ctx.strokeText(
        text,
        400,
        90
    );

    ctx.fillText(
        text,
        400,
        90
    );


    const texture=
        new THREE.CanvasTexture(
            canvas
        );


    const sprite=
        new THREE.Sprite(
            new THREE.SpriteMaterial({
                map:texture,
                transparent:true,
                depthWrite:false
            })
        );


    sprite.scale.set(
        20,
        4.5,
        1
    );


    return sprite;

}


/* =====================================================
   DISTRICT SIGNS
===================================================== */

districts.forEach(
    district=>{

        const sign=
            createTextSprite(
                district.name
            );

        sign.position.set(
            district.x,
            22,
            district.z
        );

        sign.scale.set(
            32,
            7,
            1
        );

        scene.add(
            sign
        );

    }
);


/* =====================================================
   PARK
===================================================== */

function createPark(
    x,
    z
){

    const park=
        createBox(
            62,
            .2,
            62,
            0x347a3e
        );

    park.position.set(
        x,
        .1,
        z
    );

    scene.add(
        park
    );


    for(
        let i=0;
        i<15;
        i++
    ){

        const trunk=
            createBox(
                .8,
                4,
                .8,
                0x68452e
            );

        trunk.position.set(
            x+(Math.random()-.5)*50,
            2,
            z+(Math.random()-.5)*50
        );

        scene.add(
            trunk
        );


        const tree=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    3.5,
                    12,
                    10
                ),
                material(0x267339)
            );

        tree.position.set(
            trunk.position.x,
            6,
            trunk.position.z
        );

        tree.castShadow=true;

        scene.add(
            tree
        );

    }

}


createPark(
    135,
    -135
);

createPark(
    -315,
    315
);


/* =====================================================
   PARKING
===================================================== */

function createParking(
    x,
    z
){

    const parking=
        createBox(
            65,
            .12,
            42,
            0x34373a
        );

    parking.position.set(
        x,
        .05,
        z
    );

    scene.add(
        parking
    );


    for(
        let i=-25;
        i<=25;
        i+=10
    ){

        const line=
            createBox(
                .15,
                .03,
                37,
                0xe5e5e5
            );

        line.position.set(
            x+i,
            .13,
            z
        );

        scene.add(
            line
        );

    }

}


createParking(
    315,
    135
);

createParking(
    -315,
    -45
);


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    const group=
        new THREE.Group();


    const skin=
        material(0xc68663);

    const shirt=
        material(0x24558c);

    const pants=
        material(0x22252a);

    const shoes=
        material(0x111111);


    const body=
        createBox(
            1,
            1.35,
            .55,
            0x24558c
        );

    body.position.y=
        2.15;

    group.add(body);


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                16,
                16
            ),
            skin
        );

    head.position.y=
        3.2;

    head.castShadow=true;

    group.add(head);


    const neck=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .14,
                .14,
                .25,
                10
            ),
            skin
        );

    neck.position.y=
        2.75;

    group.add(neck);


    const leftArm=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .14,
                .12,
                1.25,
                10
            ),
            shirt
        );

    leftArm.position.set(
        -.62,
        2.15,
        0
    );

    group.add(leftArm);


    const rightArm=
        leftArm.clone();

    rightArm.position.x=
        .62;

    group.add(rightArm);


    const leftLeg=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .16,
                .14,
                1.45,
                10
            ),
            pants
        );

    leftLeg.position.set(
        -.25,
        .75,
        0
    );

    group.add(leftLeg);


    const rightLeg=
        leftLeg.clone();

    rightLeg.position.x=
        .25;

    group.add(rightLeg);


    const leftShoe=
        createBox(
            .35,
            .18,
            .65,
            0x111111
        );

    leftShoe.position.set(
        -.25,
        .05,
        -.12
    );

    group.add(leftShoe);


    const rightShoe=
        leftShoe.clone();

    rightShoe.position.x=
        .25;

    group.add(rightShoe);


    group.userData={
        leftArm:leftArm,
        rightArm:rightArm,
        leftLeg:leftLeg,
        rightLeg:rightLeg,
        walkTime:0
    };


    group.traverse(
        object=>{

            if(
                object.isMesh
            ){

                object.castShadow=true;
                object.receiveShadow=true;

            }

        }
    );


    return group;

}


playerGroup=
    new THREE.Group();

scene.add(
    playerGroup
);


player=
    createPlayer();

playerGroup.add(
    player
);


playerGroup.position.set(
    0,
    0,
    40
);


/* =====================================================
   BASIC CAR — REAL 3D SHAPE
===================================================== */

function createCar(
    color=0x1764a5,
    police=false
){

    const group=
        new THREE.Group();


    const body=
        createBox(
            4.1,
            1.05,
            7.4,
            color
        );

    body.position.y=
        1.05;

    group.add(body);


    const hood=
        createBox(
            3.8,
            .35,
            1.8,
            color
        );

    hood.position.set(
        0,
        1.58,
        -2.65
    );

    group.add(hood);


    const cabin=
        createBox(
            3.2,
            1.35,
            3.5,
            0x27333b
        );

/* =====================================================
   NPC AI
===================================================== */

function updateNPCs(dt){

    for(const npc of npcs){

        npc.userData.walkTime += dt * 7;

        if(npc.userData.panic){

            const target =
                inCar
                ? car.position
                : playerGroup.position;

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        npc.position,
                        target
                    );

            direction.y=0;

            if(direction.length()<0.1){
                direction.set(
                    Math.random()-.5,
                    0,
                    Math.random()-.5
                );
            }

            direction.normalize();

            npc.position.addScaledVector(
                direction,
                4.8*dt
            );

            npc.rotation.y=
                Math.atan2(
                    direction.x,
                    direction.z
                );

            npc.userData.leftLeg.rotation.x=
                Math.sin(npc.userData.walkTime)*.8;

            npc.userData.rightLeg.rotation.x=
                -Math.sin(npc.userData.walkTime)*.8;

            npc.userData.leftArm.rotation.x=
                -Math.sin(npc.userData.walkTime)*.5;

            npc.userData.rightArm.rotation.x=
                Math.sin(npc.userData.walkTime)*.5;

            continue;
        }


        npc.userData.changeDirection-=dt;


        if(
            npc.userData.changeDirection<=0
        ){

            npc.userData.direction=
                Math.random()*
                Math.PI*2;

            npc.userData.changeDirection=
                3+
                Math.random()*5;

        }


        const direction=
            new THREE.Vector3(
                Math.sin(
                    npc.userData.direction
                ),
                0,
                Math.cos(
                    npc.userData.direction
                )
            );


        npc.position.addScaledVector(
            direction,
            npc.userData.speed*dt
        );


        npc.rotation.y=
            npc.userData.direction;


        const swing=
            Math.sin(
                npc.userData.walkTime
            )*.45;


        npc.userData.leftLeg.rotation.x=
            swing;

        npc.userData.rightLeg.rotation.x=
            -swing;

        npc.userData.leftArm.rotation.x=
            -swing*.6;

        npc.userData.rightArm.rotation.x=
            swing*.6;


        const half=
            WORLD_SIZE/2-10;


        if(
            npc.position.x>half
        ){

            npc.position.x=half;
            npc.userData.direction=
                Math.PI;

        }


        if(
            npc.position.x<-half
        ){

            npc.position.x=-half;
            npc.userData.direction=0;

        }


        if(
            npc.position.z>half
        ){

            npc.position.z=half;
            npc.userData.direction=
                -Math.PI/2;

        }


        if(
            npc.position.z<-half
        ){

            npc.position.z=-half;
            npc.userData.direction=
                Math.PI/2;

        }

    }


    npcSpawnTimer+=dt;


    if(
        npcSpawnTimer>6 &&
        npcs.length<90
    ){

        npcSpawnTimer=0;

        spawnNPC();

    }

}

/* =====================================================

function updateTraffic(dt){

    for(const traffic of trafficCars){

        const forward=
            new THREE.Vector3(
                0,
                0,
                -1
            ).applyQuaternion(
                traffic.quaternion
            );


        traffic.position.addScaledVector(
            forward,
            traffic.userData.speed*dt
        );


        for(
            const wheel of
            traffic.userData.wheels
        ){

            wheel.children[0].rotation.x+=
                traffic.userData.speed*
                dt*
                1.8;

        }


        const limit=
            WORLD_SIZE/2+35;


        if(
            traffic.position.x>limit
        ){
            traffic.position.x=-limit;
        }


        if(
            traffic.position.x<-limit
        ){
            traffic.position.x=limit;
        }


        if(
            traffic.position.z>limit
        ){
            traffic.position.z=-limit;
        }


        if(
            traffic.position.z<-limit
        ){
            traffic.position.z=limit;
        }

    }

}

/* =====================================================
   POLICE AI
===================================================== */

function updatePolice(dt){

    for(
        const police of
        policeCars
    ){

        if(
            wantedLevel<=0
        ){

            continue;

        }


        const target=
            inCar
            ? car.position
            : playerGroup.position;


        const direction=
            new THREE.Vector3()
                .subVectors(
                    target,
                    police.position
                );


        direction.y=0;


        if(
            direction.length()>2
        ){

            direction.normalize();


            const desiredAngle=
                Math.atan2(
                    direction.x,
                    direction.z
                );


            let difference=
                desiredAngle-
                police.rotation.y;


            while(
                difference>Math.PI
            ){
                difference-=Math.PI*2;
            }


            while(
                difference<-Math.PI
            ){
                difference+=Math.PI*2;
            }


            police.rotation.y+=
                THREE.MathUtils.clamp(
                    difference,
                    -dt*3,
                    dt*3
                );


            police.position.addScaledVector(
                direction,
                (
                    police.userData.speed+
                    wantedLevel*2
                )*dt
            );

        }


        if(
            police.position.distanceTo(
                target
            )<7
        ){

            playerHealth-=
                12*dt;

            updateHealthUI();

            addCameraShake(
                .08
            );

        }

    }

}

}


/* =====================================================

===================================================== */

function interactWithShop(){

        inCar
        ? car.position
        : playerGroup.position;


    for(
        const shop of
        shops
    ){

        if(
            target.distanceTo(
                shop.position
            )>

        ){

        }


        const name=
            shop.userData.name;


        if(

        ){

            if(
                money>=50

                    Math.min(
                        100,
                        playerHealth+35
                    );

                updateHealthUI();

                showMessage(
                    "Health Pack purchased"
                );

            }
            else{

                );

            }

        }


        else if(
            name==="CAR DEALERSHIP"
        ){

                "Car Dealership — New vehicles coming soon"
            );

        }


        else if(
            name==="CLOTHING STORE"
        ){

            if(
                money>=150
            ){

                money-=150;

                showMessage(
                    "New outfit purchased"
                );

            }
            else{

                showMessage(
                    "Not enough money"
                );

            }

        }


        else if(

        ){

            if(
                money>=25
            ){

                money-=25;

                playerHealth=
                    Math.min(
                        100,
                        playerHealth+15
                    );

                updateHealthUI();

                showMessage(
                    "Coffee purchased"
                );

            }
            else{

                showMessage(
                    "Not enough money"
                );

            }

        }


        else if(
            name==="RESTAURANT"
        ){

            if(
                money>=50
            ){

                money-=50;

                playerHealth=
                    Math.min(
                        100,
                        playerHealth+30
                    );

                updateHealthUI();

                showMessage(
                    "Meal purchased"
                );

            }
            else{

                showMessage(
                    "Not enough money"
                );

            }

        }


        else if(
            name==="GARAGE"
        ){

            carSpeed=0;

            showMessage(
                "Vehicle repaired"

        }


        else if(
            name==="BANK"
        ){

            money+=100;

            updateMoneyUI();

        }


        else if(
            name==="HOSPITAL"

        else if(

let currentMissionIndex=0;

/* =====================================================
   CREATE MISSION MARKER
===================================================== */

function createMissionMarker(){

    if(
        missionMarker
    ){

        scene.remove(
            missionMarker
        );

    }


    const group=
        new THREE.Group();


    const ring=
        new THREE.Mesh(

            new THREE.TorusGeometry(
                7,
                .7,
                12,
                40
            ),

            new THREE.MeshStandardMaterial({
                color:0xffc400,
                emissive:0xff9900,
                emissiveIntensity:1
            })

        );


    ring.rotation.x=
        Math.PI/2;


    group.add(
        ring
    );


    const beam=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                2,
                7,
                18,
                24,
                1,
                true
            ),

            new THREE.MeshBasicMaterial({
                color:0xffc400,
                transparent:true,
                opacity:.18,
                side:THREE.DoubleSide
            })

        );


    beam.position.y=
        9;


    group.add(
        beam
    );


    const mission=
        missions[
            currentMissionIndex
        ];


    group.position.copy(
        mission.target
    );


    missionMarker=
        group;


    scene.add(
        group
    );

}


/* =====================================================

===================================================== */

function startMission(){

    if(
        missionActive
    ){

        return;

    }


    missionActive=true;


    createMissionMarker();


    const mission=
        missions[
            currentMissionIndex
        ];


    showMessage(
        mission.name+
        " — "+
        mission.description
    );

}


/* =====================================================
   UPDATE MISSION
===================================================== */

function updateMission(){

    if(
        !missionActive ||
        !missionMarker
    ){

        return;

    }


    missionMarker.rotation.y+=
        .025;


    const target=
        inCar
        ? car.position
        : playerGroup.position;


    const distance=
        target.distanceTo(
            missionMarker.position
        );


    const distanceElement=
        document.getElementById(
            "missionDistance"
        );


    if(
        distanceElement
    ){

        distanceElement.textContent=
            Math.round(distance)+
            "m";

    }


    if(
        distance<12
    ){

        completeMission();

    }

}


/* =====================================================
   COMPLETE MISSION
===================================================== */

function completeMission(){

    const mission=
        missions[
            currentMissionIndex
        ];


    money+=
        mission.reward;


    updateMoneyUI();


    showMessage(
        "MISSION COMPLETE  +$"+
        mission.reward
    );


    missionActive=false;


    if(
        missionMarker
    ){

        scene.remove(
            missionMarker
        );

        missionMarker=null;

    }


    currentMissionIndex++;


    if(
        currentMissionIndex>=
        missions.length
    ){

        currentMissionIndex=0;

    }


    setTimeout(
        ()=>{
            startMission();
        },
        3500
    );

}

const minimapCanvas=

/* =====================================================
   MINIMAP DRAW
===================================================== */

function updateMinimap(){

    if(
        !playerGroup ||
        !camera
    ){

        return;

    }


    const ctx=
        minimapContext;


    const width=
        minimapCanvas.width;


    const height=
        minimapCanvas.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle=
        "#17202b";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const centerX=
        width/2;


    const centerY=
        height/2;


    const scale=
        .25;


    /* ROADS */

    ctx.strokeStyle=
        "#626b75";


    ctx.lineWidth=
        10;


    const roads=
        [-360,-180,0,180,360];


    for(
        const road of roads
    ){

        const px=
            centerX+
            (
                road-
                playerGroup.position.x
            )*
            scale;


        ctx.beginPath();


        ctx.moveTo(
            px,
            0
        );


        ctx.lineTo(
            px,
            height
        );


        ctx.stroke();


        const pz=
            centerY+
            (
                road-
                playerGroup.position.z
            )*
            scale;


        ctx.beginPath();


        ctx.moveTo(
            0,
            pz
        );


        ctx.lineTo(
            width,
            pz
        );


        ctx.stroke();

    }


    /* SHOPS */

    ctx.fillStyle=
        "#ffb400";


    for(
        const shop of
        shops
    ){

        const x=
            centerX+
            (
                shop.position.x-
                playerGroup.position.x
            )*
            scale;


        const y=
            centerY+
            (
                shop.position.z-
                playerGroup.position.z
            )*
            scale;


        if(
            x>0 &&
            x<width &&
            y>0 &&
            y<height
        ){

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                5,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* MISSION */

    if(
        missionMarker
    ){

        const x=
            centerX+
            (
                missionMarker.position.x-
                playerGroup.position.x
            )*
            scale;


        const y=
            centerY+
            (
                missionMarker.position.z-
                playerGroup.position.z
            )*
            scale;


        ctx.fillStyle=
            "#ffd000";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* PLAYER */

    ctx.save();


    ctx.translate(
        centerX,
        centerY
    );


    ctx.rotate(
        -playerGroup.rotation.y
    );


    ctx.fillStyle=
        "#00ff75";


    ctx.beginPath();


    ctx.moveTo(
        0,
        -11
    );


    ctx.lineTo(
        7,
        8
    );


    ctx.lineTo(
        -7,
        8
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}


/* =====================================================
   DAY / NIGHT CYCLE
===================================================== */

let worldTime=
    8;


function updateDayNight(
    dt
){

    worldTime+=
        dt*.35;


    if(
        worldTime>=24
    ){

        worldTime-=24;

    }


    const sunAngle=
        (
            worldTime/
            24
        )*
        Math.PI*2;


    if(
        typeof sunLight!=="undefined"
    ){

        sunLight.position.x=
            Math.cos(
                sunAngle
            )*
            500;


        sunLight.position.y=
            Math.sin(
                sunAngle
            )*
            500;


        sunLight.position.z=
            100;

    }


    const night=
        worldTime<6 ||
        worldTime>19;


    if(
        typeof renderer!=="undefined"
    ){

        renderer.setClearColor(
            night
            ? 0x07111e
            : 0x8fc7e8
        );

    }


    if(
        typeof scene!=="undefined"
    ){

        scene.fog=
            scene.fog ||
            new THREE.Fog(
                0x8fc7e8,
                300,
                1500
            );


        scene.fog.color.setHex(
            night
            ? 0x07111e
            : 0x8fc7e8
        );

    }

}


/* =====================================================

function updateOpenWorldCamera(){

    const target=

        : playerGroup;

    ){

    }


    const desired=
        new THREE.Vector3(
            0,
            inCar
            ? 7
            : 6,
            inCar
            ? 13
            : 11
        );


    desired.applyQuaternion(
        target.quaternion
    );


    desired.add(
        target.position
    );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target.position.x,
        target.position.y+1.8,
        target.position.z
    );

}
